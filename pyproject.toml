[project]
name = "switchboard"
version = "0.1.0"
description = "MCP gateway that turns a task into an ordered tool plan"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17", "tiktoken>=0.7"]

[project.scripts]
switchboard = "switchboard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["switchboard"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "SIM", "RUF", "FURB"]
