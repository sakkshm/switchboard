name: switchboard

services:
  minio:
    image: switchboard-minio:2025-10-15
    build:
      context: .
      dockerfile: Dockerfile.minio
      target: minio
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio-init:
    image: switchboard-mc:2025-08-13
    build:
      context: .
      dockerfile: Dockerfile.minio
      target: mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/hydradb
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  hydradb-auth:
    image: busybox:1.36
    # hydradb runs as 10001; named volumes start root-owned
    command: sh -c 'printf "%s\n" "$$HYDRADB_TOKEN" > /auth/token && chmod 644 /auth/token && chown -R 10001:10001 /auth /cache'
    environment:
      HYDRADB_TOKEN: ${HYDRADB_TOKEN:-local-development-token-32-bytes}
    volumes:
      - hydradb-auth:/auth
      - hydradb-cache:/cache

  hydradb:
    image: ghcr.io/hydra-db/hydradb@sha256:ab71d651fefee13ebb23eb56d72316065bdca563ff7587442e07be663f2bf880
    ports:
      - "18443:8443"
      - "17687:7687"
      - "19090:9090"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      hydradb-auth:
        condition: service_completed_successfully
    environment:
      CLOUD_PROVIDER: aws
      AWS_BUCKET_NAME: hydradb
      AWS_DEFAULT_REGION: us-east-1
      AWS_ALLOW_HTTP: "true"
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_VIRTUAL_HOSTED_STYLE_REQUEST: "false"
      GRAPH_DATA_PATH: slatedb-graph/data
      GRAPH_DATABASE: default
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth/token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
      GRAPH_USAGE_REPORT_ENABLED: "false"
    volumes:
      - hydradb-cache:/data/cache
      - hydradb-auth:/data/auth:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9090; printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q '200'"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  switchboard:
    build: .
    volumes:
      - switchboard-data:/app/.data
      - ./evals/results:/app/evals/results
    ports:
      - "18000:8000"
    environment:
      HYDRADB_URL: http://hydradb:8443
      HYDRADB_ADMIN_URL: http://hydradb:9090
      HYDRADB_TOKEN: ${HYDRADB_TOKEN:-local-development-token-32-bytes}
      HYDRADB_GRAPH: default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      hydradb:
        condition: service_healthy

volumes:
  minio-data:
  hydradb-cache:
  hydradb-auth:
  switchboard-data:
