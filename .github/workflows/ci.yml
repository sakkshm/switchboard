name: Switchboard checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: switchboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check app catalog evals scripts tests
      - name: Fixture chains
        run: python evals/chain_check.py
      - name: Unit, MCP and API contracts
        run: python -m pytest -q
  oss-integration:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build and start stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Real backend probe
        run: python scripts/probe.py
      - name: Live MCP ingestion and idempotent seed
        run: |
          python scripts/seed.py
          python scripts/seed.py
      - name: Graph-returned plan
        run: >-
          python scripts/plan_cli.py
          "comment on the failing test issue in acme/api"
          --inputs '{"repo":"acme/api","message":"CI fixture review"}'
          --json
      - name: Evaluation smoke
        run: python evals/run.py --reps 1 --rounds 1 --output evals/results/ci-smoke.json
      - name: Wait for application readiness
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:18000/readyz
      - name: Verify real HTTP demo flows
        run: python scripts/demo_check.py
      - name: Collect logs
        if: always()
        run: |
          mkdir -p results
          docker compose ps --all > results/compose-status.txt
          docker compose logs --no-color > results/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oss-integration-evidence
          path: |
            evals/results/ci-smoke.json
            results/demo-check.json
            results/compose-status.txt
            results/compose.log
          if-no-files-found: warn
      - name: Stop ephemeral CI stack
        if: always()
        run: docker compose down --volumes
